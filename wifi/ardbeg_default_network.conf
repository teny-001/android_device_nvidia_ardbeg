# =============================================================================
# [CM14.1-on-ardbeg 新增 2026-11-06] 出厂预置的默认 WiFi 网络
#
# 安装位置：/system/etc/wifi/ardbeg_default_network.conf
# 使用者  ：/system/bin/zz-ardbeg-firstboot-fix.sh 第 9 节
# 注册点  ：device.mk 第十九节 PRODUCT_COPY_FILES（全量编译路径）
#           repack/tools/apply_overlay.py 的 FILES（文件级重打包路径）
#
# -----------------------------------------------------------------------------
# 【为什么要预置】
#
# 用户要求「开机 WiFi 自动开启并自动连接」。开机自动开启由两处保证：
#   - 全量编译：overlay/.../SettingsProvider/res/values/defaults.xml
#               的 def_wifi_on=true（写进 settings.db）
#   - 文件级重打包：首启脚本里的 svc wifi enable（同时自己持久化 wifi_on=1）
# 但「开启」不等于「连上」。Android 7.1 的 WifiConfigManager 从
# /data/misc/wifi/ 读取已保存网络，四清之后这个目录是空的，于是 WiFi 开着
# 却停在 DISCONNECTED，用户还得手动点一次网络、输一次密码。TV 形态没有
# 触摸屏，这一步很难自助完成，所以必须把网络配置随 ROM 预置。
#
# -----------------------------------------------------------------------------
# 【为什么放在 /system/etc 而不是直接塞进 /data】
#
# /data 会被 TWRP 四清抹掉，而且刷机包是块级 OTA（system.new.dat），
# 只允许改 /system。这里放的是**模板**，不是最终生效文件：首启脚本在每次
# 开机检查 /data/misc/wifi/wpa_supplicant.conf，只有里面一个 network 块
# 都没有时才把下面这段追加上去。用户后来自己连过别的 WiFi，或者改过密码，
# 脚本就完全不动，不会覆盖用户数据。
#
# -----------------------------------------------------------------------------
# 【实测依据（2026-11-06，同一台设备）】
#
#   svc wifi disable
#   恢复一份只含下面这个 network 块的 wpa_supplicant.conf
#   rm -f /data/misc/wifi/networkHistory.txt
#   svc wifi enable
#   20 秒后 dumpsys wifi：
#       mWifiInfo SSID: CPE-0C3FB8, Supplicant state: COMPLETED
#       mNetworkInfo [type: WIFI[], state: CONNECTED/CONNECTED]
#       mDhcpResults IP address 192.168.10.110/24
#
# 结论：只预置 wpa_supplicant.conf 的 network 块就够了，
# networkHistory.txt 不必预置，反而要删掉那份「空历史」，否则
# WifiConfigManager 会用空的内存态把刚写进去的网络覆盖掉。
# networkHistory.txt 是带长度前缀的二进制序列化文本，直接 cat 看着是空的，
# 用 toybox strings 才能读出 CONFIG / HAS_EVER_CONNECTED 等字段。
#
# -----------------------------------------------------------------------------
# 【安全与定制说明，改之前请读】
#
# 这个文件里是**本机调试环境**的 SSID 和 PSK，明文写在 /system 里。
# 如果要把 ROM 发给别人，请：
#   - 把 ssid / psk / bssid 改成你自己的网络，或
#   - 直接删掉整个 network={...} 块（首启脚本会跳过注入，WiFi 仍会开机
#     自动打开，只是不自动连）。
# 不要把带真实密码的包分发到公开渠道。
#
# bssid 那行把连接锁在这一台 AP 上（实验室 CPE）。换路由器 / 换 AP 后
# 如果一直连不上，删掉 bssid 行即可让 wpa_supplicant 按 SSID 自由选 AP。
# id_str 里的 configKey 是 7.1 WifiConfigStore 用来把 supplicant 配置和
# 框架里的 WifiConfiguration 对应起来的键，删掉会导致网络被判成「新配置」
# 而丢失历史信息，建议保留；换 SSID 时记得同步改 configKey 里的转义串。
#
# -----------------------------------------------------------------------------
# 【格式约束】
#
# 首启脚本用 `sed -n '/^network={/,$p'` 抽取本文件的 network 块，所以
# 注释必须在 network={ 之前，且 network={ 必须顶格写。注释行用 '#'，
# wpa_supplicant 会忽略；不要写 -- 开头的行（部分版本的解析器会报错）。
# =============================================================================

network={
	ssid="CPE-0C3FB8"
	bssid=3c:9f:cd:0c:3f:b8
	psk="12345678"
	key_mgmt=WPA-PSK
	priority=1
	id_str="%7B%22creatorUid%22%3A%22-1%22%2C%22configKey%22%3A%22%5C%22CPE-0C3FB8%5C%22WPA_PSK%22%7D"
}
