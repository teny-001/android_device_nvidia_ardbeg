#
# Audio policy configuration for nvidia device builds
#
# ============================================================================
# 【CM14.1 on ardbeg 移植修复 2026-11-05】只保留 HAL 真正能做的 profile
# ============================================================================
#
# 【症状】
#   audioserver 在开机后无限崩溃重启（实测一次开机崩 18 次），
#   每次都是同一个断言：
#       I AudioFlinger: openOutput(), module 10 Device 400, SamplingRate 8000,
#                       Format 0x000001, Channels 33, flags 1
#       I AudioFlinger: HAL output buffer size 512 frames, normal sink buffer size 512 frames
#       I AudioFlinger: openOutput(), module 10 Device 400, SamplingRate 0,
#                       Format 00000000, Channels 0, flags 1
#       F AudioFlinger: HAL format 0 not valid for output
#       F libc    : Fatal signal 6 (SIGABRT) in tid (audioserver)
#
#   崩溃点是 frameworks/av/services/audioflinger/Threads.cpp:2484
#       if (!audio_is_valid_format(mFormat)) {
#           LOG_ALWAYS_FATAL("HAL format %#x not valid for output", mFormat);
#       }
#   注意是 LOG_ALWAYS_FATAL，不是 ALOGE —— 没有任何挽回余地，直接 abort。
#
# 【日志里那几个数字的含义】
#   Device 400    = 0x400 = AUDIO_DEVICE_OUT_AUX_DIGITAL（就是 HDMI）
#   Channels 33   = 0x33  = AUDIO_CHANNEL_OUT_QUAD（前左|前右|后左|后右）
#   SamplingRate 8000 = 下面 multichannel profile 里 sampling_rates 的第一项
#   flags 1       = AUDIO_OUTPUT_FLAG_DIRECT（不是 PRIMARY=2）
#   => 命中下面被删掉的 `multichannel` profile，一个 4 声道 DIRECT 输出。
#
# 【根因：配置撒谎，HAL 兜不住，AudioFlinger 只好自杀】
#   audio_hw.c 的 start_output_pcm() 里，pcm_config 的 format 是写死的：
#       .format = PCM_FORMAT_S16_LE,
#   也就是说这个 tinyalsa HAL **只会**开 16bit 小端 PCM，声道数由
#   nvaudio_conf.xml 里 hw_stream 的配置决定（本机只有 2 声道扬声器通路）。
#   它根本不支持：
#       * 多声道（QUAD / SURROUND / 5POINT1 / 7POINT1）
#       * IEC61937 压缩透传（AC3 / EAC3 / DTS）
#       * 压缩音频直通（MP3 / AAC offload）
#       * HDMI（AUX_DIGITAL）输出 —— 这份 HAL 是从小米平板1(mocha)搬来的，
#         mocha 没有 HDMI 音频通路，nvaudio_conf.xml 里也没有对应 hw_stream
#   但原来的 audio_policy.conf（照抄 NVIDIA Shield Tablet 的）把这些全声明了。
#   AudioPolicyManager 信了配置，去为 HDMI 打开 multichannel 输出：
#       第一次 openOutput 带着 profile 的初始参数（8000/QUAD/PCM16）——
#       HAL 硬着头皮开了（pcm_open 用了 S16_LE，缓冲区 512 帧）；
#       随后 APM 发现这是个动态 profile，走 checkOutputsForDevice() 的
#       hasDynamicAudioProfile() 分支（AudioPolicyManager.cpp:3869），
#       先 closeOutput() 再 pickAudioProfile() 重新取参数；
#       而 pickAudioProfile()（AudioPort.cpp:298）开头就把三个值清零：
#           format = AUDIO_FORMAT_DEFAULT;  samplingRate = 0;  channelMask = NONE;
#       然后因为拿不到有效 profile 直接 return —— 三个值就这么全是 0。
#       第二次 openOutput 带着全 0 参数进 HAL，HAL 原样把 0 回填到 config
#       （audio_hw.c:2371 config->format = out.common->format），
#       AudioFlinger 拿到 format=0，撞上 LOG_ALWAYS_FATAL。
#
# 【修法】
#   把配置改成"只说真话"：删掉 HAL 做不到的 profile，并去掉所有
#   AUDIO_DEVICE_OUT_AUX_DIGITAL 声明。APM 没有可用的 profile 就根本不会
#   去为 HDMI 开输出，也就不会走到那个清零的 pickAudioProfile。
#
#   保留的只有：
#       primary      —— 48kHz / 立体声 / PCM_16 / PRIMARY，这是唯一真实通路
#       a2dp         —— 蓝牙 A2DP，由 bluetooth 栈走独立 HAL，与本 HAL 无关
#       usb          —— USB 声卡，同理走独立 HAL
#
# 【为什么保留 ALL_SCO 但删掉 AUX_DIGITAL】
#   AUDIO_DEVICE_OUT_ALL_SCO 是蓝牙 SCO（通话音），AudioPolicyManager 会把它
#   路由到 a2dp/primary 而不真的让本 HAL 开 HDMI 那样的独立输出；
#   而 AUX_DIGITAL 会触发"为这个设备新开一个输出"的路径，正是崩溃点。
#
# 【后续如果真要让 HDMI 出声】
#   不能靠改回这几行配置 —— 那只会把 audioserver 打回崩溃循环。
#   必须先在 audio_hw.c / nvaudio_conf.xml 里补一条真正的 HDMI hw_stream
#   （Tegra K1 的 HDMI 音频走 HDA 控制器，原厂 4.4.4 的
#   audio.primary.tegra.so 是支持的，但那份 blob 的 ABI 是 4.4 的，
#   见 patches/README.md 的 audio_policy_abi 专章）。
#   在补完之前，宁可让系统"没有 HDMI 音频"，也不要让 audioserver 崩。
#
# 【实测】改完之后 audioserver 不再崩溃（此前每次开机崩 18 次），
#        dmesg 里不再出现 "Service 'audioserver' (pid N) killed by signal 6"。
# ============================================================================

# Global configuration section: lists input and output devices always present on the device
# as well as the output device selected by default.
# Devices are designated by a string that corresponds to the enum in audio.h

global_configuration {
  attached_output_devices AUDIO_DEVICE_OUT_SPEAKER|AUDIO_DEVICE_OUT_EARPIECE
  default_output_device AUDIO_DEVICE_OUT_SPEAKER
  attached_input_devices AUDIO_DEVICE_IN_BUILTIN_MIC|AUDIO_DEVICE_IN_REMOTE_SUBMIX
}

# audio hardware module section: contains descriptors for all audio hw modules present on the
# device. Each hw module node is named after the corresponding hw module library base name.
# For instance, "primary" corresponds to audio.primary.<device>.so.
# The "primary" module is mandatory and must include at least one output with
# AUDIO_OUTPUT_FLAG_PRIMARY flag.
# Each module descriptor contains one or more output profile descriptors and zero or more
# input profile descriptors. Each profile lists all the parameters supported by a given output
# or input stream category.
# The "channel_masks", "formats", "devices" and "flags" are specified using strings corresponding
# to enums in audio.h and audio_policy.h. They are concatenated by use of "|" without space or "\n".

audio_hw_modules {
  primary {
    outputs {
      # ---- 唯一真实通路：48kHz / 立体声 / S16_LE ----
      # devices 里**不能**再出现 AUDIO_DEVICE_OUT_AUX_DIGITAL，否则
      # setDeviceConnectionState(AUX_DIGITAL) 时 APM 会尝试为 HDMI 开输出。
      primary {
        sampling_rates 48000
        channel_masks AUDIO_CHANNEL_OUT_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_OUT_SPEAKER|AUDIO_DEVICE_OUT_WIRED_HEADSET|AUDIO_DEVICE_OUT_WIRED_HEADPHONE|AUDIO_DEVICE_OUT_EARPIECE|AUDIO_DEVICE_OUT_ALL_SCO|AUDIO_DEVICE_OUT_REMOTE_SUBMIX
        flags AUDIO_OUTPUT_FLAG_PRIMARY
      }
      # ---- 以下四个 profile 已删除，原因见文件头 ----
      #   multichannel               4 声道 DIRECT（QUAD/SURROUND/5.1/7.1）
      #   aux_ac3_dts_pass_through   IEC61937 AC3/EAC3/DTS 透传
      #   ulp_output                 MP3/AAC 压缩直通
      #   dual_audio                 多声道 + 全采样率 DIRECT
      # 保留它们会让 APM 为 HDMI/多声道请求打开本 HAL 做不到的输出，
      # 最终在 Threads.cpp:2484 的 LOG_ALWAYS_FATAL 上 abort audioserver。
      # 真要恢复，先把 audio_hw.c 和 nvaudio_conf.xml 里对应的 hw_stream 补上。
    }
    inputs {
      primary {
        sampling_rates 8000|11025|12000|16000|22050|24000|32000|44100|48000
        channel_masks AUDIO_CHANNEL_IN_MONO|AUDIO_CHANNEL_IN_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_IN_BUILTIN_MIC|AUDIO_DEVICE_IN_BLUETOOTH_SCO_HEADSET|AUDIO_DEVICE_IN_WIRED_HEADSET|AUDIO_DEVICE_IN_REMOTE_SUBMIX
      }
    }
  }
  a2dp {
    outputs {
      a2dp {
        sampling_rates 44100
        channel_masks AUDIO_CHANNEL_OUT_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_OUT_ALL_A2DP
      }
    }
  }
  usb {
    outputs {
      usb {
        sampling_rates 44100
        channel_masks AUDIO_CHANNEL_OUT_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_OUT_ALL_USB|AUDIO_DEVICE_OUT_ANLG_DOCK_HEADSET|AUDIO_DEVICE_OUT_DGTL_DOCK_HEADSET
      }
    }
    inputs {
      usb {
        sampling_rates 8000|11025|12000|16000|22050|24000|32000|44100|48000
        channel_masks AUDIO_CHANNEL_IN_MONO|AUDIO_CHANNEL_IN_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_IN_ANLG_DOCK_HEADSET|AUDIO_DEVICE_IN_DGTL_DOCK_HEADSET
      }
    }
  }

}
